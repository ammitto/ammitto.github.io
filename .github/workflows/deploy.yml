name: build_deploy

on:
  push:
    branches:
    - main
  pull_request:
  repository_dispatch:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Explicit bash adds -o pipefail, so a failing producer in a
        # pipeline (find | wc, jq | ...) fails its step instead of being
        # masked by the consumer's exit code.
        shell: bash
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout ammitto gem
        uses: actions/checkout@v4
        with:
          repository: ammitto/ammitto
          # Transitional pin, superseded inside this stack. It was taken
          # when main was 1629e2e ("[WIP] Fix production harmonize
          # pipeline"), whose harmonize crashed on an undefined variable
          # `r`. That work landed as ammitto/ammitto#18 on 2026-07-24, and
          # main is now 541b0cf — eight merged PRs later, #18 through #25
          # on first-parent history — so this pin has none of: harmonize
          # health gates, --allow-empty, per-source sources/<code>.jsonld
          # aggregates, the exporter filename clamp, or harmonize
          # input-directory discovery.
          # The repin to 541b0cf and the removal of the aggregate-restore
          # step below both live in the follow-up PR of this stack; the
          # pin stays here only so the CI-workspace fix reviews on its
          # own. Merging this PR without that follow-up deploys a pre-#18
          # gem's output.
          ref: 8203303c5f250cc8372cb91465ac51d3bd34b766
          path: ammitto-gem

      - name: Checkout data repositories
        run: |
          # Clone all data-* repositories in parallel. Wait on each PID and
          # fail the step if any clone failed, so a partial dataset is never
          # harmonized and deployed (a bare `wait` always exits 0).
          pids=()
          for repo in data-au data-ca data-ch data-cn data-eu data-eu-vessels data-jp data-nz data-ru data-tr data-uk data-un data-un-vessels data-us data-wb; do
            git clone --depth 1 "https://github.com/ammitto/${repo}.git" "${repo}" &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          # bundler-cache runs bundle install (and caches it), so no
          # separate install step is needed.
          bundler-cache: true
          working-directory: ammitto-gem

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install website dependencies
        run: npm ci

      - name: Run harmonization
        working-directory: ammitto-gem
        run: |
          # Remove the committed public/api/v1 snapshot first: harmonize only
          # creates/overwrites files, so without this, stale committed files
          # would survive into the deployed artifact next to fresh output.
          rm -rf ../public/api/v1
          bundle exec ruby exe/ammitto harmonize --scan --verbose \
            --sources-dir .. \
            --output-dir ../public/api/v1

      - name: Restore per-source aggregates
        run: |
          # The pinned gem predates the per-source sources/<code>.jsonld
          # aggregates that the live API serves (and the site fetches),
          # so restore them from the committed api/v1 snapshot. Remove
          # this step together with the pin once the gem generates them
          # itself. If the destination already exists, harmonize has
          # started generating the aggregates: fail loudly rather than
          # nest or overwrite fresh output with the stale snapshot.
          if [ -e public/api/v1/sources ]; then
            echo "public/api/v1/sources already exists: harmonize now generates per-source aggregates; remove this step together with the gem pin."
            exit 1
          fi
          # Validate the snapshot before publishing it. BrowseEntitiesPage
          # loads these aggregates through useSanctionsData, whose
          # JsonLdEntity contract reads a bare `id` plus snake_case fields
          # (entity_type, names[].full_name, source_references[]) — the
          # pre-revamp schema this snapshot is written in. Do NOT gate on
          # JSON-LD node shape here: 96550 of the snapshot's 96731 nodes
          # carry `id` rather than `@id`, so an @id/@type assertion would
          # reject the only schema this consumer can actually read.
          # Measured 2026-07-29 across all 15 files: those 96550 bare ids
          # are ALL distinct, only 24 nodes in total resolve to a
          # `/unknown` placeholder, and 93102 of 93423 name objects carry
          # a non-blank full_name. The records are real, named and
          # distinctly identified.
          # What IS wrong is coverage. Three aggregates collapsed to a
          # single entity each against the counts stats.json claims —
          # eu 1 of 11720, ru 1 of 1995, un_vessels 1 of 32 — so
          # restoring them unchecked would serve a near-empty EU list as
          # live data. The two gates below are therefore: a
          # schema-agnostic identifier check (@id or id, non-blank), and
          # a coverage floor at a quarter of the committed count. The
          # twelve healthy files clear that floor with room (the tightest
          # is ch at 8255 against 4797); the three collapsed ones fail it.
          # Both candidates are tested independently rather than with
          # `.["@id"] // .id`: that alternative yields on false/null only,
          # so a numeric or whitespace @id would mask a perfectly usable
          # `id` and fail a file this gate should pass. The coverage
          # counter anchors on the whole entity IRI instead of searching
          # for "/entity/" anywhere in the string, so a value such as
          # "garbage/entry/x/entity/y" cannot pad the count, and it
          # excludes whitespace from every path component so an id like
          # "https://x/entity/ / " is not counted as a real entity.
          command -v jq > /dev/null \
            || { echo "jq is required to validate the aggregate snapshot"; exit 1; }
          for src in api/v1/sources/*.jsonld; do
            code=$(basename "$src" .jsonld)
            jq -es 'length == 1 and (.[0] | type == "object"
                      and (.["@graph"] | type == "array" and length > 0
                        and all(type == "object"
                          and ([.["@id"], .id]
                                 | map(select(type == "string" and test("\\S")))
                                 | length > 0))))' \
              "$src" > /dev/null \
              || { echo "${src}: not a single JSON object, or nodes carry no usable identifier under @id or id"; exit 1; }
            distinct=$(jq -es \
              '.[0]["@graph"]
                 | map([.["@id"], .id]
                         | map(select(type == "string"
                                      and test("^https?://[^/[:space:]]+/entity/[^/[:space:]]+/[^/[:space:]]+$")))
                         | .[0] | select(. != null))
                 | unique | length' "$src") \
              || { echo "${src}: cannot count distinct entity ids"; exit 1; }
            committed=$(jq -er --arg s "$code" \
              '.sources[$s].entities | select(type == "number" and . == floor and . > 0)' \
              api/v1/stats.json) \
              || { echo "${code}: no committed entity count to check the snapshot against"; exit 1; }
            # Clamp to 1: integer division turns any committed count below
            # 4 into a floor of 0, which a fully collapsed aggregate would
            # pass. Every source must contribute at least one entity.
            floor=$(( committed / 4 ))
            [ "$floor" -ge 1 ] || floor=1
            if [ "$distinct" -lt "$floor" ]; then
              echo "${src}: holds ${distinct} distinct entity ids against a committed ${committed} (floor ${floor}); refusing to publish a collapsed aggregate"
              exit 1
            fi
          done
          cp -R api/v1/sources public/api/v1/sources

      - name: Verify harmonized output
        run: |
          # The pinned gem has no output health gates, so guard here: fail
          # the run instead of deploying an empty or incomplete API tree.
          command -v jq > /dev/null \
            || { echo "jq is required for verification"; exit 1; }
          jq -e . public/api/v1/stats.json > /dev/null \
            || { echo "stats.json is missing or not valid JSON"; exit 1; }
          test -s public/api/v1/search-index.json \
            || { echo "search-index.json is missing or empty"; exit 1; }
          jq -e '(.entities | type == "array") and (.entities | length > 0)' \
            public/api/v1/search-index.json > /dev/null \
            || { echo "search-index.json has no entities array"; exit 1; }
          test -s public/api/v1/all.jsonld \
            || { echo "all.jsonld is missing or empty"; exit 1; }
          count=$(find public/api/v1 -type f | wc -l)
          echo "Harmonized output contains ${count} files"
          test "$count" -ge 100 \
            || { echo "File count ${count} is below the floor of 100"; exit 1; }
          # Static endpoints the site fetches at runtime must all exist.
          for facet in authorities countries regimes statuses types; do
            test -s "public/api/v1/facets/${facet}.json" \
              || { echo "Missing facet file: facets/${facet}.json"; exit 1; }
          done
          for f in classes.jsonld properties.jsonld hierarchy.json; do
            test -s "public/api/v1/ontology/${f}" \
              || { echo "Missing ontology file: ontology/${f}"; exit 1; }
          done
          for kind in entity entry legal-instrument regime authority group document-type organization; do
            test -s "public/api/v1/node/${kind}/index.jsonld" \
              || { echo "Missing node index: node/${kind}/index.jsonld"; exit 1; }
          done
          # Guard against a partial harmonize: the pinned gem swallows
          # per-file transformation errors and still reports success, so a
          # file-count floor alone cannot catch one. Floor every source at
          # a QUARTER of its committed-snapshot count: the snapshot is the
          # only baseline that exists for all 15 sources (their repo
          # layouts differ and several keep no processed/ YAML), but its
          # counts drift and at least one (au) is double-counted at ~2x
          # the repo's actual data — a quarter-floor still catches a true
          # collapse. Tighten to half once the pin is lifted and the
          # snapshot is regenerated. Every restored per-source aggregate
          # must be present and valid JSON.
          for src in au ca ch cn eu eu_vessels jp nz ru tr uk un un_vessels us wb; do
            # The committed baseline must be a number (a missing one would
            # silently disable this source's floor); the harmonized count
            # defaults a missing source key to 0 so it fails the floor
            # below with an accurate message instead.
            expected=$(jq -er --arg s "$src" \
              '.sources[$s].entities | select(type == "number") | floor' \
              api/v1/stats.json) \
              || { echo "Invalid committed entity count for ${src}"; exit 1; }
            actual=$(jq -er --arg s "$src" \
              '.sources[$s].entities // 0 | select(type == "number") | floor' \
              public/api/v1/stats.json) \
              || { echo "Invalid harmonized entity count for ${src}"; exit 1; }
            floor=$((expected / 4))
            if [ "$actual" -lt "$floor" ]; then
              echo "Source ${src}: harmonized ${actual} entities, floor is" \
                "${floor} (quarter of committed ${expected})"
              exit 1
            fi
            jq -e . "public/api/v1/sources/${src}.jsonld" > /dev/null \
              || { echo "Missing or invalid aggregate: sources/${src}.jsonld"; exit 1; }
          done
          entities_count=$(jq -er '.total_entities | select(type == "number") | floor' \
            public/api/v1/stats.json) \
            || { echo "Invalid total_entities in stats.json"; exit 1; }
          echo "Total entities: ${entities_count}"
          test "$entities_count" -ge 1000 \
            || { echo "Total entities ${entities_count} is below the floor of 1000"; exit 1; }

      - name: Build Vue.js app with Vite
        run: npm run build
        env:
          NODE_ENV: production
          # The harmonize step above has already populated public/api/v1 with
          # fresh multi-source data; stop build:api from clobbering it with
          # the stale CN-only copy from data-cn.
          SKIP_API_DATA: '1'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
