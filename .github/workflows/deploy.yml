name: build_deploy

on:
  push:
    branches:
    - main
  pull_request:
  repository_dispatch:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout ammitto gem
        uses: actions/checkout@v4
        with:
          repository: ammitto/ammitto
          path: ammitto-gem

      - name: Checkout data repositories
        run: |
          # Clone all data-* repositories
          for repo in data-au data-ca data-ch data-cn data-eu data-eu-vessels data-jp data-nz data-ru data-tr data-uk data-un data-un-vessels data-us data-wb; do
            git clone --depth 1 https://github.com/ammitto/${repo}.git ${repo} &
          done
          wait

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ammitto-gem

      - name: Install ammitto gem dependencies
        working-directory: ammitto-gem
        run: bundle install --jobs 4 --retry 3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install website dependencies
        run: npm ci

      - name: Run harmonization
        working-directory: ammitto-gem
        run: |
          bundle exec ruby exe/ammitto harmonize --scan --verbose \
            --sources-dir .. \
            --output-dir ../public/api/v1

      - name: Build Vue.js app with Vite
        run: npm run build
        env:
          NODE_ENV: production

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
