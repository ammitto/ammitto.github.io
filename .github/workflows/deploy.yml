name: build_deploy

on:
  push:
    branches:
    - main
  pull_request:
  repository_dispatch:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Measured on 2026-08-13 (run 31681782113): 7m16s end to end. Sixteen
    # shallow clones took 5s, Ruby setup 8s, npm ci 2s, unit tests 2s,
    # harmonize 3m05s, the output verification 15s, the Vite build 37s,
    # Playwright chromium 28s, the browser suite 2m13s, artifact upload 10s.
    #
    # Thirty is a little over four times that, and the headroom is aimed at
    # the two steps that grow with the data rather than with this repository:
    # harmonize and the browser suite together are three quarters of the run,
    # and both scale with an entity count that is upstream of us — 60,981 at
    # the last calibration, the figure the composed proof recorded against
    # the pin below, and the scale the 7m16s above was already measured at.
    # (25,128 was the count on 2026-08-06; the data repositories themselves
    # grew, at an unchanged gem.) The dataset can roughly triple before the
    # timeout, rather than a real defect, becomes the thing that fails the
    # job — and long before that, a run drifting toward thirty minutes is the
    # signal that publishing has outgrown one job.
    #
    # Anything beyond that is a hang: a clone against an unresponsive remote,
    # or a harmonize that stopped making progress. Six hours of a stuck
    # runner is the alternative, and this workflow does not cancel in
    # progress, so a wedged run also holds every later publish behind it.
    timeout-minutes: 30
    defaults:
      run:
        # Explicit bash adds -o pipefail, so a failing producer in a
        # pipeline (find | wc, jq | ...) fails its step instead of being
        # masked by the consumer's exit code.
        shell: bash
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout ammitto gem
        uses: actions/checkout@v4
        with:
          repository: ammitto/ammitto
          # Pinned to ammitto/ammitto main, moved nineteen commits from
          # 722b65a. Unlike the last move, this one changes almost
          # nothing that is published, and that is the finding rather
          # than an absence of checking.
          #
          # Both pins were harmonized over ONE set of shallow clones of
          # the 15 data-* repositories, taken 2026-09-01, so the delta is
          # the gem alone. Both runs: 14 succeeded, 0 failed, 1 exempted,
          # exit 0. Both produce 123,827 files and the file lists are
          # identical. 8,152 files differ byte-for-byte; 8,151 of those
          # differ ONLY in a retrievedAt timestamp, because the two runs
          # ran four minutes apart.
          #
          # That leaves exactly ONE behavioural difference in the whole
          # tree: by-organization/cn/ministry-of-commerce.jsonld drops
          # from 21 published documents to 7. That is 70c8565 (gem #58),
          # which matches an organization on its identifier instead of a
          # prefix of it. The 14 that go are the Unreliable Entity List
          # Working Mechanism's, a different body whose id the substring
          # test was swallowing. The over-count has been live on this
          # site since the slices were introduced.
          #
          # Every per-source entity count is identical across the two
          # pins, so .github/harmonize-thresholds.json is deliberately
          # NOT regenerated and every floor holds with exactly the margin
          # it was derived with. Checked rather than assumed, against the
          # new pin's stats.json: au 3856/2698, ca 5582/3907, ch
          # 8667/6064, cn 322/225, eu 6329/4430, eu_vessels 597/417, jp
          # 5097/3567, nz 2112/1478, tr 276/193, uk 6349/4444, un
          # 1011/707, un_vessels 59/41, us 19342/13444, wb 1585/1109, and
          # the total 61,184 against 42,731. ru stays pending.
          #
          # The nineteen commits also carry the Canada bilingual element
          # fix (#80), the blank-identifier refusal (#77) and the
          # collapse guard (#81). None of them changes this output,
          # because the site harmonizes each repository's processed YAML
          # rather than re-parsing the source documents, and data-ca had
          # already re-harvested with the fixed gem. They matter to the
          # harvest, not to this build.
          #
          # DEBT, not introduced here but made larger by it: the manifest's
          # gem_commit still reads 5e8b95c, which was already six commits
          # behind the pin it replaced and is now twenty-five behind. Its
          # own derivation note says to regenerate the ENTIRE file from the
          # next reviewed full 15-source harvest rather than hand-tune
          # floors, and that is owed. Not done here because regeneration
          # needs the fifteen solo runs that note describes, so no source's
          # failure can be masked by another, and that is a recalibration
          # rather than a pin move. The workflow reads only
          # publishing_sources, pending_sources, source_floors and
          # total_entities_floor, none of the provenance fields, so the
          # staleness costs accuracy in the record and nothing in the gate.
          # Pin-to-SHA stays the policy.
          ref: 1cdc8702c49a42a4238f8beb52719d30dcbbffdf
          path: ammitto-gem

      - name: Checkout data repositories
        run: |
          # Clone all data-* repositories in parallel. Wait on each PID and
          # fail the step if any clone failed, so a partial dataset is never
          # harmonized and deployed (a bare `wait` always exits 0).
          pids=()
          for repo in data-au data-ca data-ch data-cn data-eu data-eu-vessels data-jp data-nz data-ru data-tr data-uk data-un data-un-vessels data-us data-wb; do
            git clone --depth 1 "https://github.com/ammitto/${repo}.git" "${repo}" &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          # bundler-cache runs bundle install (and caches it), so no
          # separate install step is needed.
          bundler-cache: true
          working-directory: ammitto-gem

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install website dependencies
        run: npm ci

      - name: Run unit tests
        # vue-tsc and the production build never execute the fetch-boundary
        # normalizer; this is the only check that does. The tests are plain
        # JavaScript on Node's built-in runner, so they need neither a test
        # dependency nor a Node newer than this repo already required.
        run: npm run test:unit

      - name: Run harmonization
        working-directory: ammitto-gem
        run: |
          # Remove the committed public/api/v1 snapshot first: harmonize only
          # creates/overwrites files, so without this, stale committed files
          # would survive into the deployed artifact next to fresh output.
          rm -rf ../public/api/v1
          # --combine emits the aggregated all.jsonld (downloaded by the
          # client library) and its all.ttl Turtle rendering; the gem
          # gates both behind the flag and defaults it off.
          #
          # The sources are named rather than discovered with --scan: the
          # published set must stay exactly the set the threshold manifest
          # was calibrated for, so adding a source is a deliberate edit to
          # this list and .github/harmonize-thresholds.json together. The
          # list is the manifest's derivation_command — all 15 sources. An
          # earlier revision named only 13, excluding us and ch, because the
          # gem then refused their committed input outright
          # (announcement-format YAML in data-us/data-ch, blank local ids in
          # every data-jp file). The gem pinned above transforms all three
          # (ch record-shape dispatch, jp announcement ingestion), so that
          # reasoning is obsolete: the 2026-08-07 calibration harvest
          # measured us 19189, ch 8604 and jp 5097 entities, each exit 0.
          #
          # --allow-empty exempts the one pending source whose input is
          # missing upstream: ru ships no processed YAML, and the verify
          # step below holds it at exactly zero. un and ca left this list on
          # 2026-08-07 and un_vessels leaves it now, each for the same
          # reason — the data-repo gitignore fix landed their committed
          # corpora, so they are floor-gated publishing sources, and a
          # source gated on a floor must not also be exempt from the
          # producer's own gates or a future outage is excused twice.
          bundle exec ruby exe/ammitto harmonize \
            eu un wb uk au ca cn ru tr nz jp eu_vessels un_vessels us ch \
            --verbose --combine \
            --allow-empty ru \
            --sources-dir .. \
            --output-dir ../public/api/v1

      - name: Verify harmonized output
        run: |
          # Independent workflow-side gate. The gem enforces its own health
          # gates (nonzero exit on per-file transform errors, source errors,
          # zero entities, missing aggregates), but those cannot catch
          # partial-source loss — a source that "succeeds" with far fewer
          # entities than reality. Entity floors live in
          # .github/harmonize-thresholds.json (derivation documented there);
          # regenerate them from a reviewed fresh harmonize when sources
          # legitimately shrink or grow.
          # Sources are split in the manifest into two disjoint lists.
          # publishing_sources are harmonized and published, and each is
          # gated on its entity floor as before. pending_sources are the
          # ones whose input is missing or unusable upstream; each is gated
          # on harmonizing to EXACTLY zero and on publishing no aggregate,
          # so the day real data appears for one of them this step fails and
          # forces a recalibration instead of quietly certifying a partial
          # restore. The two lists must together cover every key in
          # source_floors, so a source cannot be dropped from both and
          # silently lose its gate.
          thresholds=.github/harmonize-thresholds.json
          command -v jq > /dev/null \
            || { echo "jq is required for verification"; exit 1; }
          # Slurp (-s) so empty files and multi-document streams fail: a
          # bare `jq -e .` exits 0 on both, and a multi-document file
          # would make the per-source jq lookups below emit MULTILINE
          # values that break [ -lt ] into a silent pass.
          jq -es 'length == 1 and (.[0] | type == "object")' "$thresholds" > /dev/null \
            || { echo "threshold manifest ${thresholds} is missing, invalid, or not a single JSON object"; exit 1; }
          jq -es 'length == 1 and (.[0] | type == "object")' public/api/v1/stats.json > /dev/null \
            || { echo "stats.json is missing, invalid, or not a single JSON object"; exit 1; }
          # jq object parsing is last-duplicate-wins, so a duplicated key
          # in either decision input would silently swap the reviewed
          # value for the file's last one. Detect duplicates from the raw
          # stream events: leaf paths alone are not enough (a duplicated
          # container key can emit disjoint leaf paths), so close events
          # are mapped to their container path too — every key
          # instantiation (scalar leaf, empty container, or container
          # close) must then appear exactly once. -n with explicit inputs
          # is deliberate: under -s --stream, jq 1.6 splits the final
          # close event into a second input and -e keys off that stray
          # last output. The graph artifacts below are only checked
          # structurally; last-wins there matches what any consumer's
          # parser sees, so duplicates cannot flip those gates.
          for f in "$thresholds" public/api/v1/stats.json; do
            jq -en --stream \
              '[inputs | if length == 2 then .[0] else .[0][:-1] end]
                | length == (unique | length)' \
              "$f" > /dev/null \
              || { echo "duplicate JSON keys in ${f}"; exit 1; }
          done
          jq -es 'length == 1 and (.[0] | (.entities | type == "array") and (.entities | length > 0))' \
            public/api/v1/search-index.json > /dev/null \
            || { echo "search-index.json is not a single JSON object with a non-empty entities array"; exit 1; }
          # The client library downloads all.jsonld: require one JSON
          # object with a non-empty @graph, not just a non-empty file
          # (~59 MB; the slurp parse costs a few seconds).
          jq -es 'length == 1 and (.[0] | type == "object" and (.["@graph"] | type == "array" and length > 0))' \
            public/api/v1/all.jsonld > /dev/null \
            || { echo "all.jsonld is not a single JSON-LD object with a non-empty @graph"; exit 1; }
          test -s public/api/v1/all.ttl \
            || { echo "all.ttl is missing or empty"; exit 1; }
          count=$(find public/api/v1 -type f | wc -l)
          echo "Harmonized output contains ${count} files"
          test "$count" -ge 100 \
            || { echo "File count ${count} is below the floor of 100"; exit 1; }
          # Static endpoints the site fetches at runtime must all exist.
          for facet in authorities countries regimes statuses types; do
            test -s "public/api/v1/facets/${facet}.json" \
              || { echo "Missing facet file: facets/${facet}.json"; exit 1; }
          done
          for f in classes.jsonld properties.jsonld hierarchy.json; do
            test -s "public/api/v1/ontology/${f}" \
              || { echo "Missing ontology file: ontology/${f}"; exit 1; }
          done
          for kind in entity entry legal-instrument regime authority group document-type organization; do
            test -s "public/api/v1/node/${kind}/index.jsonld" \
              || { echo "Missing node index: node/${kind}/index.jsonld"; exit 1; }
          done
          # Large-loss regression gate: floor every source's harmonized
          # entity count at its manifest floor. The list comes from the
          # manifest, but the partition check above makes dropping a key
          # fail loudly rather than silently disable that source's gate —
          # a source removed from publishing_sources must appear in
          # pending_sources, where it is then held at exactly zero.
          # Counts and floors must be plain non-negative
          # integers within 1e8 (floors strictly positive — zero or
          # negative would disable the gate; the bound keeps jq from
          # emitting exponent notation that [ -lt ] cannot parse); the
          # digits-only case guard makes the shell comparisons fail
          # closed even if a jq quirk lets a non-integer through. The
          # harmonized count defaults a missing source key to 0 so it
          # fails the floor below with an accurate message instead.
          # Every generated per-source aggregate must be a single JSON
          # object with a non-empty @graph (a zero-byte file passes a
          # bare `jq -e .`) whose nodes each carry a non-blank identifier.
          # The gate asserts the PRODUCER contract: @id plus camelCase
          # property names, which is what the gem's context, its generated
          # ontology, its Turtle rendering and this repo's own
          # public/schemas/context.jsonld all declare. The site reaches that
          # vocabulary through src/utils/normalizeNode.ts at the fetch
          # boundary, so the published bytes no longer have to carry the
          # site's internal snake_case field names.
          # (An earlier revision asserted the consumer contract instead —
          # bare `id`, names[].full_name — and failed deliberately to name
          # the mismatch. The mismatch is now resolved in the normalizer,
          # so the gate follows the producer.)
          # Identifier candidates are tested independently rather than
          # with `.["@id"] // .id`: that alternative yields on false/null
          # only, so a numeric or whitespace @id would mask a usable `id`.
          # Read the two source lists, and prove they partition source_floors
          # exactly: same membership, no overlap, no source in neither list.
          # Codes are restricted to [a-z0-9_] so a manifest edit cannot smuggle
          # a path, a glob or a word split into the loops below.
          jq -es 'length == 1 and (.[0] |
                    (.publishing_sources | type == "array" and length > 0
                       and all(type == "string" and test("^[a-z0-9_]+$")))
                    and (.pending_sources | type == "object"
                       and (keys | all(test("^[a-z0-9_]+$"))))
                    and ((.publishing_sources + (.pending_sources | keys)) as $named
                         | ($named | length) == ($named | unique | length)
                           and ($named | sort) == (.source_floors | keys | sort))
                    and (.pending_sources | to_entries
                       | all(.value | type == "string" and test("\\S"))))' \
            "$thresholds" > /dev/null \
            || { echo "publishing_sources and pending_sources must be non-empty, disjoint, each a [a-z0-9_] code, together exactly the keys of source_floors, and every pending source must carry a reason"; exit 1; }
          publishing=$(jq -er '.publishing_sources | join(" ")' "$thresholds")
          pending=$(jq -er '.pending_sources | keys_unsorted | join(" ")' "$thresholds")
          echo "Publishing sources: ${publishing}"
          echo "Pending sources:    ${pending}"
          # Vocabulary reachability. The node index loop above only proves
          # these files are non-empty, and non-empty is what a uk-only
          # document-type index is: for weeks the gem loaded the first
          # requested source's sources/supporting/ directory and stopped, the
          # graph carried uk's six document types and five organizations and
          # nothing from ch, cn, jp, ru or us, and this step passed every day.
          # The entity floors could not see it either — vocabularies come
          # from sources/supporting/, not from the entity corpus, so no
          # gated count moves when one vanishes. ru proves the two are
          # independent in both directions: it is a pending source held at
          # zero entities that nonetheless publishes a vocabulary.
          # BOTH source lists are passed, for that reason.
          #
          # The expectation is derived from the clones this run already made
          # rather than written down here: a repository shipping
          # sources/supporting/document-types.yml is declaring those
          # identifiers belong in the graph, so each must appear in the index
          # AND have the node file the browse page fetches for it. Adding a
          # row passes, deleting one passes, a source going dark fails and is
          # named. A count in the threshold manifest would have to be
          # hand-revised the day a repository starts or stops shipping a
          # vocabulary, with nothing to prompt it.
          #
          # Node and its devDependencies are installed two steps above, and
          # the check reads only the workspace, so this adds no network use.
          node scripts/verify-source-vocabularies.js \
            --sources-root . \
            --api-dir public/api/v1 \
            --sources "${publishing} ${pending}"
          # A pending source must harmonize to exactly zero and ship no
          # aggregate. Anything else means its input came back and its floor
          # has to be recalibrated before it can be published.
          for src in $pending; do
            actual=$(jq -er --arg s "$src" \
              '.sources[$s].entities // 0 | select(type == "number" and . == floor and . >= 0)' \
              public/api/v1/stats.json) \
              || { echo "Invalid harmonized entity count for pending source ${src}"; exit 1; }
            if [ "$actual" -ne 0 ]; then
              echo "Pending source ${src} harmonized ${actual} entities: its input is back. Move it to publishing_sources and recalibrate its floor."
              exit 1
            fi
            if [ -e "public/api/v1/sources/${src}.jsonld" ]; then
              echo "Pending source ${src} published an aggregate: move it to publishing_sources and recalibrate its floor."
              exit 1
            fi
          done
          for src in $publishing; do
            floor=$(jq -er --arg s "$src" \
              '.source_floors[$s] | select(type == "number" and . == floor and . > 0 and . <= 100000000)' \
              "$thresholds") \
              || { echo "Missing or invalid floor for ${src} in ${thresholds}"; exit 1; }
            case "$floor" in (''|*[!0-9]*)
              echo "Non-integer floor for ${src}: ${floor}"; exit 1;;
            esac
            actual=$(jq -er --arg s "$src" \
              '.sources[$s].entities // 0 | select(type == "number" and . == floor and . >= 0 and . <= 100000000)' \
              public/api/v1/stats.json) \
              || { echo "Invalid harmonized entity count for ${src}"; exit 1; }
            case "$actual" in (''|*[!0-9]*)
              echo "Non-integer entity count for ${src}: ${actual}"; exit 1;;
            esac
            if [ "$actual" -lt "$floor" ]; then
              echo "Source ${src}: harmonized ${actual} entities, floor is ${floor}"
              exit 1
            fi
            jq -es 'length == 1 and (.[0] | type == "object"
                      and (.["@graph"] | type == "array" and length > 0
                        and all(type == "object"
                          and ([.["@id"], .id]
                                 | map(select(type == "string" and test("\\S")))
                                 | length > 0))))' \
              "public/api/v1/sources/${src}.jsonld" > /dev/null \
              || { echo "Missing or invalid aggregate: sources/${src}.jsonld"; exit 1; }
            # Four rules, in the producer's terms.
            # (a) Crash safety, over EVERY node: normalizeGraph converts
            #     the whole @graph and transformEntity then walks both
            #     `entity.names?.map(n => n.full_name)` and
            #     `entity.addresses?.map(a => a.street)`. Each throws a
            #     TypeError if its value is a non-array non-null, or if it
            #     is an array holding a null; loadSourceEntities turns any
            #     throw into [] for the ENTIRE source, so one bad record
            #     silently empties a whole list. Normalizing does not
            #     change that: it preserves array-ness and null elements.
            #     Both keys must therefore be absent/null, or an array
            #     with no null element, on every node rather than only on
            #     the ones that look like entities. String or number
            #     elements are safe (property access on them just yields
            #     undefined) and are allowed.
            # (b) Identity, universal over candidates: candidates are
            #     selected WITHOUT relying on the id, so a node that
            #     presents as an entity but carries a broken one cannot
            #     slip past the quantifier. Schema is all-or-nothing per
            #     file, so every candidate needs an @id matching the
            #     entity IRI shape, whitespace excluded from every path
            #     component.
            # (c) Names, existential: at least one candidate must carry a
            #     usable names[].fullName. Only availability is relaxed
            #     here — shape safety stays universal under (a). A handful
            #     of genuinely nameless records is data quality, not a
            #     schema failure, and gating on "every" would reject
            #     otherwise-healthy files.
            # (d) The entity->entry edge, the field whose omission blanked
            #     /entity/:id. Universal, not existential: harmonize only
            #     ingests a pair when both halves exist, and the ingest
            #     derives the edge from entry.entityId for the sources whose
            #     transformer does not set it, so EVERY entity node must
            #     carry at least one entry IRI. Each IRI must match the
            #     entry IRI shape AND name a SanctionEntry node present in
            #     this same aggregate whose entityId points back at the
            #     entity, so a dangling reference — which the site turns
            #     into a 404 and a silently missing sanctions section —
            #     fails here instead. Indexing only typed SanctionEntry
            #     nodes keyed by "<entry IRI> <entityId>" means a stray
            #     object whose @id merely contains "/entry/" cannot satisfy
            #     a reference. Same-file resolution is correct because
            #     entity and entry IRIs are source-namespaced and harmonize
            #     ingests the pair together; no transformer emits a
            #     cross-source edge.
            jq -es 'def walkable: type == "null"
                                  or (type == "array"
                                      and all(type != "null"));
                    # Node IRIs must carry the published base literally
                    # (json_ld_graph_exporter.rb BASE_URI) and exactly the
                    # segment count the exporter writes — entity/{src}/{id},
                    # entry/{src}/{list}/{id}. The tail must be plain,
                    # non-empty, single-slash segments: another host, an
                    # empty segment (//), a percent escape, a backslash, a
                    # query, a fragment, whitespace, or a "."/".." segment
                    # all name a file the published tree does not contain,
                    # because the site turns the tail straight into the
                    # api/v1/node/** path it fetches.
                    def segment: "[^/?#%\\\\[:space:]]+";
                    def node_iri($kind; $depth):
                      type == "string"
                      and test("^https://www\\.ammitto\\.org/\($kind)"
                               + ("/" + segment) * $depth + "$")
                      and (test("(^|/)\\.{1,2}(/|$)") | not);
                    def entry_iri: node_iri("entry"; 3);
                    def entity_iri: node_iri("entity"; 2);
                    .[0]["@graph"] as $g
                      | ($g | map(select(type == "object"
                                         and .["@type"] == "SanctionEntry"))) as $typed_entries
                      | ($g | map(select(type == "object"
                                         and (.["@type"] | type == "string")
                                         and (. as $n | ["Entity", "PersonEntity", "OrganizationEntity",
                                                         "VesselEntity", "AircraftEntity"]
                                              | any(. == $n["@type"]))))) as $typed_entities
                      | ($g | map(select(type == "object" and (.["@id"] | type == "string")))
                            | map(.["@id"])) as $all_ids
                      | ($typed_entries
                         | map(select((.["@id"] | type == "string")
                                      and (.entityId | type == "string"))
                               | {key: .["@id"], value: .entityId})
                         | from_entries) as $entry_owner
                      | ($typed_entities
                         | map(select(.["@id"] | type == "string")
                               | {key: .["@id"],
                                  value: (.hasSanctionEntry
                                          | if type == "array" then . else [] end)})
                         | from_entries) as $edges
                      | ($g | all(type == "object"
                                  and (.names | walkable)
                                  and (.addresses | walkable)))
                        # Global @id uniqueness first: every index below is
                        # built with from_entries, which is last-wins, so a
                        # duplicate id would otherwise hide a second node.
                        and ($all_ids | length == ($all_ids | unique | length))
                        # (e) Every typed entry is well formed and
                        #     reciprocated: its entityId names an entity in
                        #     this file whose hasSanctionEntry lists it back.
                        #     Selecting by @type rather than by a well-formed
                        #     id means a malformed node cannot be filtered
                        #     quietly out of the check, and reciprocity
                        #     catches the inverse of a dangling reference —
                        #     a real entry the entity forgot to link, which
                        #     is silent loss on /entity/:id.
                        and ($typed_entries
                             | all((.["@id"] | entry_iri)
                                   and (.entityId | entity_iri)
                                   and (.["@id"] as $iri
                                        | .entityId as $owner
                                        | ($edges[$owner] // []) | any(. == $iri))))
                        and ($typed_entities
                             | length > 0
                               and all(.["@id"] | entity_iri)
                               and all(.["@id"] as $entity
                                       | .hasSanctionEntry
                                       | type == "array" and length > 0
                                         and all(. as $iri
                                                 | ($iri | entry_iri)
                                                   and ($entry_owner[$iri] == $entity)))
                               and any(.names | type == "array"
                                       and any(type == "object"
                                               and (.fullName | type == "string"
                                                    and test("\\S")))))' \
              "public/api/v1/sources/${src}.jsonld" > /dev/null \
              || { echo "sources/${src}.jsonld does not match the producer contract: every node must be an object whose names AND addresses are absent, null, or an array holding no null; every typed SanctionEntry needs a well-formed unique @id and an entityId whose entity links back; every entity node needs an @id and a hasSanctionEntry naming entry nodes present in this file; at least one needs a names[].fullName. /browse/entities or /entity/:id would render it empty"; exit 1; }
          done
          total_floor=$(jq -er \
            '.total_entities_floor | select(type == "number" and . == floor and . > 0 and . <= 100000000)' \
            "$thresholds") \
            || { echo "Missing or invalid total_entities_floor in ${thresholds}"; exit 1; }
          case "$total_floor" in (''|*[!0-9]*)
            echo "Non-integer total_entities_floor: ${total_floor}"; exit 1;;
          esac
          entities_count=$(jq -er \
            '.total_entities | select(type == "number" and . == floor and . >= 0 and . <= 100000000)' \
            public/api/v1/stats.json) \
            || { echo "Invalid total_entities in stats.json"; exit 1; }
          case "$entities_count" in (''|*[!0-9]*)
            echo "Non-integer total_entities: ${entities_count}"; exit 1;;
          esac
          echo "Total entities: ${entities_count} (floor ${total_floor})"
          test "$entities_count" -ge "$total_floor" \
            || { echo "Total entities ${entities_count} is below the floor of ${total_floor}"; exit 1; }

      - name: Build Vue.js app with Vite
        run: npm run build
        env:
          NODE_ENV: production
          # The harmonize step above has already populated public/api/v1 with
          # fresh multi-source data; stop build:api from clobbering it with
          # the stale CN-only copy from data-cn.
          SKIP_API_DATA: '1'

      - name: Install Playwright chromium
        # Only chromium, and only its dependencies. The browser version is
        # pinned by the exact @playwright/test version in package-lock.json.
        run: npx playwright install --with-deps chromium

      - name: Browser tests against the harmonized build
        # ci.yml runs the same suite, but against the committed CN-only
        # snapshot. This is the only place the tests see the artifact that
        # actually deploys: fifteen sources, real per-source endpoints, real
        # names. The layout defect these tests exist for — a long sanctioned
        # name stretching a card grid past a phone viewport — is exactly the
        # kind that only shows up with the full dataset, so gating the upload
        # on it is the point rather than an inconvenience.
        #
        # Every route in the router is measured here. Two used to be dropped
        # at this scale, through an E2E_FULL_DATASET environment variable
        # this step used to set: the organization and document-type pages
        # rebuilt their document lists from every entry node in the corpus
        # and never finished painting. Both now read one published summary,
        # so the exclusion and the variable that carried it are gone. See the
        # note in tests/routes.js before adding either back.
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-harmonized
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: build
    # This job builds nothing and uploads nothing: it hands the artifact
    # build already produced to the Pages API and waits. The last three
    # deployments from main took 23s, 30s and 24s, so five minutes is ten
    # times the observed cost and there is no step here that could
    # legitimately grow into it.
    #
    # It is the tightest timeout in either workflow on purpose. The
    # concurrency group above deliberately does not cancel in progress, so a
    # deployment stuck waiting on the Pages API blocks every subsequent
    # publish for as long as it hangs — with the default ceiling, a whole
    # working day of daily data publishes queued behind one wedged call.
    timeout-minutes: 5
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
