# Neo4j Data Quality Validation Workflow
#
# This workflow validates the knowledge graph data by:
# 1. Starting a Neo4j container
# 2. Importing the CSV data
# 3. Running validation queries
# 4. Reporting any data quality issues

name: Neo4j Data Quality

on:
  push:
    branches: [main]
    paths:
      - 'neo4j_import/**'
      - '.github/workflows/neo4j-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'neo4j_import/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5.26.0
        env:
          NEO4J_AUTH: neo4j/password
          NEO4J_dbms_security_allow_csv_import_from_file_urls: "true"
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        volumes:
          - ${{ github.workspace }}/neo4j_import:/var/lib/neo4j/import

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for Neo4j to be ready
        run: |
          for i in {1..30}; do
            if docker exec ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p password "RETURN 1" 2>/dev/null; then
              echo "Neo4j is ready"
              break
            fi
            echo "Waiting for Neo4j... ($i/30)"
            sleep 2
          done

      - name: Create constraints
        run: |
          docker exec ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p password "
          CREATE CONSTRAINT IF NOT EXISTS FOR (e:Entity) REQUIRE e.id IS UNIQUE;
          CREATE CONSTRAINT IF NOT EXISTS FOR (entry:Entry) REQUIRE entry.id IS UNIQUE;
          CREATE CONSTRAINT IF NOT EXISTS FOR (a:Authority) REQUIRE a.code IS UNIQUE;
          CREATE CONSTRAINT IF NOT EXISTS FOR (c:Country) REQUIRE c.code IS UNIQUE;
          CREATE CONSTRAINT IF NOT EXISTS FOR (n:Name) REQUIRE n.id IS UNIQUE;
          "

      - name: Import countries
        run: |
          docker exec ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p password "
          LOAD CSV FROM 'file:///countries.csv' AS row
          MERGE (c:Country {code: row[0]})
          SET c.name = row[1];
          "

      - name: Import authorities
        run: |
          docker exec ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p password "
          LOAD CSV FROM 'file:///authorities.csv' AS row
          MERGE (a:Authority {code: row[0]})
          SET a.name = row[1];
          "

          docker exec ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p password "
          LOAD CSV FROM 'file:///rel_authority_country.csv' AS row
          MATCH (a:Authority {code: row[0]})
          MATCH (c:Country {code: row[1]})
          MERGE (a)-[:LOCATED_IN]->(c);
          "

      - name: Import entities
        run: |
          docker exec ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p password "
          LOAD CSV FROM 'file:///entities.csv' AS row
          MERGE (e:Entity {id: row[0]})
          SET e.local_id = row[1], e.source = row[2], e.type = row[3], e.primary_name = row[4];
          "

      - name: Import entries
        run: |
          docker exec ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p password "
          LOAD CSV FROM 'file:///entries.csv' AS row
          MERGE (entry:Entry {id: row[0]})
          SET entry.authority_code = row[3], entry.list_type = row[4], entry.status = row[5];
          "

      - name: Import names
        run: |
          docker exec ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p password "
          LOAD CSV FROM 'file:///names.csv' AS row
          MERGE (n:Name {id: row[0]})
          SET n.entity_id = row[1], n.full_name = row[2], n.is_primary = row[3];
          "

      - name: Create relationships
        run: |
          # Entry -> Entity
          docker exec ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p password "
          LOAD CSV FROM 'file:///rel_entry_entity.csv' AS row
          MATCH (entry:Entry {id: row[0]})
          MATCH (e:Entity {id: row[1]})
          MERGE (entry)-[:FOR_ENTITY]->(e);
          "

          # Entry -> Authority
          docker exec ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p password "
          LOAD CSV FROM 'file:///rel_entry_authority.csv' AS row
          MATCH (entry:Entry {id: row[0]})
          MATCH (a:Authority {code: row[1]})
          MERGE (entry)-[:LISTED_BY]->(a);
          "

          # Entity -> Name
          docker exec ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p password "
          LOAD CSV FROM 'file:///rel_entity_name.csv' AS row
          MATCH (e:Entity {id: row[0]})
          MATCH (n:Name {id: row[1]})
          MERGE (e)-[:HAS_NAME]->(n);
          "

      - name: Validate node counts
        id: node_counts
        run: |
          echo "## Node Counts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          docker exec ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p password "
          MATCH (n)
          RETURN labels(n)[0] as node_type, count(n) as count
          ORDER BY count DESC;
          " | while read line; do echo "$line" >> $GITHUB_STEP_SUMMARY; done

      - name: Validate relationship counts
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Relationship Counts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          docker exec ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p password "
          MATCH ()-[r]->()
          RETURN type(r) as relationship_type, count(r) as count
          ORDER BY count DESC;
          " | while read line; do echo "$line" >> $GITHUB_STEP_SUMMARY; done

      - name: Check for orphaned nodes
        id: orphans
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Data Quality Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check for entries without entities
          MISSING_ENTITY=$(docker exec ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p password "
          MATCH (entry:Entry)
          WHERE NOT (entry)-[:FOR_ENTITY]->()
          RETURN count(entry) as count;
          " | tail -1)
          echo "- Entries missing entity link: $MISSING_ENTITY" >> $GITHUB_STEP_SUMMARY

          # Check for entries without authorities
          MISSING_AUTH=$(docker exec ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p password "
          MATCH (entry:Entry)
          WHERE NOT (entry)-[:LISTED_BY]->()
          RETURN count(entry) as count;
          " | tail -1)
          echo "- Entries missing authority link: $MISSING_AUTH" >> $GITHUB_STEP_SUMMARY

          # Check for entities without names
          MISSING_NAME=$(docker exec ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p password "
          MATCH (e:Entity)
          WHERE NOT (e)-[:HAS_NAME]->()
          RETURN count(e) as count;
          " | tail -1)
          echo "- Entities missing name link: $MISSING_NAME" >> $GITHUB_STEP_SUMMARY

          # Check for orphaned names
          ORPHAN_NAMES=$(docker exec ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p password "
          MATCH (n:Name)
          WHERE NOT (n)<-[:HAS_NAME]-()
          RETURN count(n) as count;
          " | tail -1)
          echo "- Orphaned names: $ORPHAN_NAMES" >> $GITHUB_STEP_SUMMARY

          # Fail if any orphans exist (allow 1 for header row)
          if [ "$MISSING_ENTITY" -gt 1 ] || [ "$MISSING_AUTH" -gt 1 ] || [ "$ORPHAN_NAMES" -gt 1 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **FAILED**: Data quality issues detected!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **PASSED**: All data quality checks passed!" >> $GITHUB_STEP_SUMMARY

      - name: Entity type distribution
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Entity Type Distribution" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          docker exec ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p password "
          MATCH (e:Entity)
          RETURN e.type as entity_type, count(e) as count
          ORDER BY count DESC;
          " | while read line; do echo "$line" >> $GITHUB_STEP_SUMMARY; done

      - name: Authority distribution
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Authority Distribution" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          docker exec ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p password "
          MATCH (e:Entity)<-[:FOR_ENTITY]-(entry:Entry)-[:LISTED_BY]->(a:Authority)
          RETURN a.name as authority, count(DISTINCT e) as entity_count
          ORDER BY entity_count DESC;
          " | while read line; do echo "$line" >> $GITHUB_STEP_SUMMARY; done
